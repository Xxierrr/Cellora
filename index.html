<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f6f2" />
    <meta name="description" content="Cellora is an explainable AI screening aid for cervical cell image analysis. Upload a Pap smear image and review a clear, responsible result." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Cellora — Cervical cell analysis, made clearer" />
    <meta property="og:description" content="An explainable AI screening aid for cervical cytology. See the model's result, its confidence and the regions that shaped it." />
    <!-- Use an absolute URL here once the site is deployed. -->
    <meta property="og:image" content="/images/cytology-hero.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply the saved theme before first paint to avoid a light-mode flash.
      (function () {
        try {
          var saved = localStorage.getItem('cellora-theme')
          var dark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (error) {}
      })()
    </script>
    <link rel="preload" as="image" href="/images/cytology-hero.png" fetchpriority="high" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet" />
    <title>Cellora — Cervical cell analysis, made clearer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
